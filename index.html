<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Periodic Table of People</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Login screen (Image A) -->
  <section id="login">
    <div class="card">
      <h1>Welcome Back</h1>
      <p>Sign in with your Google account to load the data from Google Sheets.</p>
      <button id="googleBtn" type="button">
        <span class="g-icon">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        </span>
        Sign in with Google
      </button>
      <p id="loginError" class="error" hidden></p>
    </div>
  </section>

  <!-- Visualization -->
  <section id="app" hidden>
    <div id="topbar">
      <span id="status">Loading data…</span>
      <span id="user"><img id="avatar" alt=""><span id="userName"></span><button id="signOut" type="button">Sign out</button></span>
    </div>
    <div id="container"></div>
    <div id="menu">
      <button data-layout="table" class="active">TABLE</button>
      <button data-layout="sphere">SPHERE</button>
      <button data-layout="helix">HELIX</button>
      <button data-layout="grid">GRID</button>
    </div>
    <div id="legend">
      <span>LOW</span><span class="bar"></span><span>HIGH</span>
    </div>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
